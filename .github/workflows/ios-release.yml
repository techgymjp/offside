name: iOS TestFlight upload

# 本番の広告の設定で iOS 版をビルドし、App Store Connect(TestFlight)にアップロードする。
# 既定のブランチへの push と、手動の実行(Actions → iOS TestFlight upload → Run workflow)で動く。
# 審査への提出は App Store Connect で行う(docs/IOS_BUILD.md)。
# 必要な Secrets: IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64
on:
  push:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'vendor/**'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    # Secrets がそろっていて、既定のブランチのときだけアップロードする
    if: github.ref_name == github.event.repository.default_branch
    env:
      HAS_SECRETS: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
      BUNDLE_ID: jp.techgym.offside
      TEAM_ID: GNM3VTX9YG
      PROFILE_NAME: offside App Store (GitHub Actions)
      # Mac の Xcode から手で上げるビルド(1, 2, 3…)と重ならないよう、101 から始める
      BUILD_NUMBER: ${{ github.run_number + 100 }}
    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::iOS の Secrets が登録されていないので、アップロードしません(docs/IOS_BUILD.md の 7 章)"

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.HAS_SECRETS == 'true'
        timeout-minutes: 5
        run: npm ci

      # タイトル画面に出すバージョンと、本番の広告 ID でゲームのファイルを iOS のプロジェクトにコピー
      - name: Copy web assets (production ads)
        if: env.HAS_SECRETS == 'true'
        run: |
          export VERSION_NAME="$(node -p "require('./package.json').version")"
          export VERSION_CODE="$BUILD_NUMBER"
          ADMOB_MODE=production npm run build
          npx cap sync ios

      # 配布用の証明書を一時的なキーチェーンに入れる
      - name: Import the distribution certificate
        if: env.HAS_SECRETS == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # 証明書のシリアル番号(プロファイルを作るときに、Apple Developer の証明書と照らし合わせる)
          SERIAL="$(/usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nokeys -passin env:P12_PASSWORD \
            | /usr/bin/openssl x509 -noout -serial | cut -d= -f2)"
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write the App Store Connect API key
        if: env.HAS_SECRETS == 'true'
        env:
          P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # App Store 用のプロファイルを API で取得(なければ作る)
      - name: Get the provisioning profile
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/ios-profile.py

      # App の Release だけ手動署名にする(Swift Package のライブラリには署名の設定を渡さない)
      - name: Use manual signing for the App target
        if: env.HAS_SECRETS == 'true'
        run: |
          python3 - <<'PY'
          import os, re
          p = 'ios/App/App.xcodeproj/project.pbxproj'
          s = open(p).read()
          blocks = [b for b in re.finditer(r'/\* Release \*/ = \{\s*isa = XCBuildConfiguration;\s*buildSettings = \{(.*?)\};\s*name = Release;', s, re.S) if 'PRODUCT_BUNDLE_IDENTIFIER' in b.group(1)]
          assert len(blocks) == 1, 'App の Release の設定が見つからない'
          b = blocks[0]
          body = b.group(1).replace('CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{os.environ["PROFILE_SPECIFIER"]}";')
          assert body != b.group(1), 'CODE_SIGN_STYLE が見つからない'
          s = s[:b.start(1)] + body + s[b.end(1):]
          open(p, 'w').write(s)
          PY
          grep -n "CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_IDENTITY" ios/App/App.xcodeproj/project.pbxproj

      - name: Archive
        if: env.HAS_SECRETS == 'true'
        working-directory: ios/App
        run: |
          set -o pipefail  # xcodebuild が失敗したら、tail を通してもこのステップを失敗にする
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive | tail -60

      - name: Upload to App Store Connect (TestFlight)
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_SPECIFIER}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "::notice::ビルド ${BUILD_NUMBER} を App Store Connect にアップロードしました。10〜30 分ほどで TestFlight に出ます"

      - name: Clean up
        if: always() && env.HAS_SECRETS == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
